name: Build CatDefenseGame V6 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source from Dropbox
        run: |
          curl -L --fail --retry 3 \
          "https://www.dropbox.com/scl/fi/l43wd9swz1z6zgjm3n14h/CatDefenseGameSourceV6_FULL.zip?rlkey=b75g28zfflw01xcdcg7s1e82y&st=3g5bisb1&dl=1" \
          -o source.zip

          unzip -q source.zip -d source

          echo "Source extracted:"
          find source -maxdepth 3 -type f | head -50

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "SDK Manager:"
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -L --fail \
          https://services.gradle.org/distributions/gradle-8.7-bin.zip \
          -o gradle.zip

          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Locate project
        run: |
          find source -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          cd source/CatDefenseGameSource
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatDefenseGameV6-APK
          path: source/CatDefenseGameSource/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
