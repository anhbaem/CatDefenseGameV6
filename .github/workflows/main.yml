name: Build CatDefenseGame APK

on:
  workflow_dispatch:
    inputs:
      dropbox_url:
        description: "Dropbox ZIP URL"
        required: true
        type: string

      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    name: Download Dropbox ZIP and Build APK
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 1. Download project from Dropbox
      # ==============================
      - name: Download project from Dropbox
        env:
          DROPBOX_URL: ${{ inputs.dropbox_url }}
        run: |
          set -e

          URL="$DROPBOX_URL"

          # Dropbox dl=0 -> dl=1
          URL="${URL/dl=0/dl=1}"

          # Nếu URL chưa có dl parameter
          if [[ "$URL" != *"dl="* ]]; then
            if [[ "$URL" == *"?"* ]]; then
              URL="${URL}&dl=1"
            else
              URL="${URL}?dl=1"
            fi
          fi

          echo "Downloading project..."

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "$URL" \
            -o CatDefenseGame.zip

          echo "Downloaded file:"
          ls -lh CatDefenseGame.zip

      # ==============================
      # 2. Check ZIP
      # ==============================
      - name: Check downloaded ZIP
        run: |
          set -e

          file CatDefenseGame.zip

          echo "Testing ZIP..."

          unzip -t CatDefenseGame.zip

      # ==============================
      # 3. Extract project
      # ==============================
      - name: Extract project
        run: |
          set -e

          rm -rf project

          mkdir -p project

          unzip -q CatDefenseGame.zip -d project

          echo "Project files:"
          find project -maxdepth 5 -
