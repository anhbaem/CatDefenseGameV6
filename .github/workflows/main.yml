name: Build CatDefenseGame V6 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download clean source from Dropbox
        run: |
          set -e

          curl -L --fail --retry 3 \
          "https://www.dropbox.com/scl/fi/3ql18oy0tdpxzypc4nhnz/CatDefenseGameSourceV6_CLEAN.zip?rlkey=oj7qyr2p4jaemv848u2lv3rdp&st=a9decllv&dl=1" \
          -o source.zip

          echo "=== ZIP ==="
          ls -lh source.zip
          unzip -t source.zip

          mkdir -p source
          unzip -q source.zip -d source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          set -e

          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          set -e

          curl -L --fail \
          https://services.gradle.org/distributions/gradle-8.7-bin.zip \
          -o gradle.zip

          unzip -q gradle.zip -d "$HOME"

          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Find Android project
        run: |
          set -e

          PROJECT_FILE=$(find "$GITHUB_WORKSPACE/source" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            echo "=== FILES ==="
            find "$GITHUB_WORKSPACE/source" -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show project
        run: |
          echo "PROJECT_DIR=$PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 3 -type f -print

      - name: Build APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle --no-daemon assembleDebug

      - name: Find APK
        run: |
          echo "=== APK ==="

          find "$GITHUB_WORKSPACE/source" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatDefenseGameV6-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
