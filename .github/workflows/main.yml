name: Build CatDefenseGame APK

on:
  workflow_dispatch:
    inputs:
      dropbox_url:
        description: "Dropbox ZIP direct download URL"
        required: true
        type: string

      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. DOWNLOAD ZIP FROM DROPBOX
      # ============================================================
      - name: Download project ZIP
        env:
          DROPBOX_URL: ${{ inputs.dropbox_url }}
        run: |
          set -e

          URL="$DROPBOX_URL"

          # Convert Dropbox share URL to direct download
          if [[ "$URL" == *"dl=0"* ]]; then
            URL="${URL//dl=0/dl=1}"
          elif [[ "$URL" != *"dl=1"* ]]; then
            if [[ "$URL" == *"?"* ]]; then
              URL="${URL}&dl=1"
            else
              URL="${URL}?dl=1"
            fi
          fi

          echo "Downloading project..."

          curl \
            -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "$URL" \
            -o project.zip

          echo "Downloaded:"
          ls -lh project.zip

          echo "Checking ZIP..."
          file project.zip
          unzip -t project.zip


      # ============================================================
      # 2. EXTRACT ZIP
      # ============================================================
      - name: Extract project
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q project.zip -d project

          echo "Extracted files:"
          find project -maxdepth 6 -type f | sort | head -300


      # ============================================================
      # 3. FIND ACTUAL ANDROID PROJECT ROOT
      # ============================================================
      - name: Detect Android project root
        run: |
          set -
