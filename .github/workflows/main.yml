name: Build CatDefenseGame V6 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source from Dropbox
        run: |
          curl -L --fail --retry 3 \
          "https://www.dropbox.com/scl/fi/l43wd9swz1z6zgjm3n14h/CatDefenseGameSourceV6_FULL.zip?rlkey=b75g28zfflw01xcdcg7s1e82y&st=3g5bisb1&dl=1" \
          -o source.zip

          mkdir -p source
          unzip -q source.zip -d source

          echo "=== ZIP CONTENT ==="
          find source -maxdepth 5 -type f | head -100

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "Android SDK:"
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -L --fail \
          https://services.gradle.org/distributions/gradle-8.7-bin.zip \
          -o gradle.zip

          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Find Android project
        run: |
          PROJECT_FILE=$(find "$GITHUB_WORKSPACE/source" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Cannot find settings.gradle"
            echo "=== ALL FILES ==="
            find "$GITHUB_WORKSPACE/source" -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          echo "Building project:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle --no-daemon assembleDebug

      - name: Find APK
        run: |
          echo "=== APK FILES ==="

          find "$GITHUB_WORKSPACE/source" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatDefenseGameV6-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
