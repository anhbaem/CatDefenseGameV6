name: Build CatDefenseGame APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Download Dropbox ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Download project from Dropbox
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            "https://www.dropbox.com/scl/fi/nvk2na31ewlgbiayvqi5l/CatDefenseGameV10_9_4_UI_TAB_HEAD_SYNC_FIXED.zip?rlkey=5niz2uh7ilsab0rhtcnyu40vq&st=cpmbwi5x&dl=1" \
            -o CatDefenseGame.zip

      - name: Check downloaded ZIP
        run: |
          ls -lh CatDefenseGame.zip
          file CatDefenseGame.zip
          unzip -t CatDefenseGame.zip

      - name: Extract project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q CatDefenseGame.zip -d project

      - name: Detect Android project root
        run: |
          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::Không tìm thấy settings.gradle/settings.gradle.kts"
            find project -maxdepth 5 -type f -print
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")
          echo "Project root: $ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_ROOT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Find and prepare APK artifact
        run: |
          echo "APK files found:"
          find "$PROJECT_ROOT" -type f -name "*.apk" -print

          APK=$(find "$PROJECT_ROOT" -type f -path "*/app/build/outputs/apk/debug/*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::Không tìm thấy APK debug"
            find "$PROJECT_ROOT" -type f -name "*.apk" -print
            exit 1
          fi

          echo "Using APK: $APK"
          rm -rf apk-output
          mkdir -p apk-output
          cp "$APK" apk-output/CatDefenseGame-debug.apk

          ls -lh apk-output/CatDefenseGame-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatDefenseGame-V10.9.4-APK
          path: apk-output/CatDefenseGame-debug.apk
          if-no-files-found: error
