name: Build CatDefenseGame APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Download Dropbox ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Download project from Dropbox
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            "https://www.dropbox.com/scl/fi/h7p0nc51w5yfu5rwlcy2o/CatDefenseGameV10_8_MAP_REFERENCE_FIXED.zip?rlkey=n0lfz95rwx5aa8hv15w961oe&st=mmt3ovnv&dl=1" \
            -o CatDefenseGame.zip

      - name: Check downloaded ZIP
        run: |
          ls -lh CatDefenseGame.zip
          file CatDefenseGame.zip
          unzip -t CatDefenseGame.zip

      - name: Extract project
        run: |
          mkdir project
          unzip -q CatDefenseGame.zip -d project

      - name: Detect Android project root
        run: |
          ROOT=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\\n' | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "::error::Không tìm thấy settings.gradle/settings.gradle.kts"
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_ROOT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Find APK
        run: |
          find "$PROJECT_ROOT" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatDefenseGame-V10.8-MAP-FIXED-APK
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
