name: Build CatDefenseGame APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Download from Dropbox and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Download project from Dropbox
        run: |
          curl -L \
            "https://www.dropbox.com/scl/fi/oyka58xcebnorcu1t2el5/CatDefenseGameV11_8_TABS_MAP_FRAME_FIXED.zip?rlkey=tfygoig558m3udtgytr0n2zvw&st=25xtol1j&dl=1" \
            -o CatDefenseGame.zip

      - name: Check downloaded ZIP
        run: |
          ls -lh CatDefenseGame.zip
          file CatDefenseGame.zip

      - name: Extract project
        run: |
          mkdir project
          unzip -q CatDefenseGame.zip -d project

      - name: Find Gradle project
        run: |
          echo "Project contents:"
          find project -maxdepth 3 -type f \( -name "gradlew" -o -name "settings.gradle*" -o -name "build.gradle*" \) -print

      - name: Detect project root
        run: |
          ROOT=$(find project -type f -name "gradlew" -printf '%h\n' | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "Không tìm thấy gradlew"
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_ROOT/gradlew"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_ROOT"
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find "$PROJECT_ROOT" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatDefenseGame-V11.8-APK
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
