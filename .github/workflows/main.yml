name: Build CatDefenseGame APK

on:
  workflow_dispatch:
    inputs:
      dropbox_url:
        description: "Dropbox ZIP URL của source game"
        required: true
        type: string

      build_type:
        description: "Chọn loại APK"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    name: Download Dropbox ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. TẢI SOURCE TỪ DROPBOX
      # ==========================================
      - name: Download project from Dropbox
        env:
          DROPBOX_URL: ${{ inputs.dropbox_url }}
        run: |
          set -e

          URL="$DROPBOX_URL"

          # Dropbox dl=0 -> dl=1
          URL="${URL/dl=0/dl=1}"

          # Nếu chưa có dl=
          if [[ "$URL" != *"dl="* ]]; then
            if [[ "$URL" == *"?"* ]]; then
              URL="${URL}&dl=1"
            else
              URL="${URL}?dl=1"
            fi
          fi

          echo "Downloading source..."
          echo "$URL"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            "$URL" \
            -o CatDefenseGame.zip

          echo "Downloaded:"
          ls -lh CatDefenseGame.zip

      # ==========================================
      # 2. KIỂM TRA ZIP
      # ==========================================
      - name: Check downloaded ZIP
        run: |
          set -e

          file CatDefenseGame.zip

          echo "Testing ZIP..."
          unzip -t CatDefenseGame.zip

      # ==========================================
      # 3. GIẢI NÉN SOURCE
      # ==========================================
      - name: Extract project
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q CatDefenseGame.zip -d project

          echo "Extracted project:"
          find project -maxdepth 5 -type f | sort | head -300

      # ==========================================
      # 4. TÌM ROOT ANDROID PROJECT
      # ==========================================
      - name: Detect Android project root
        run: |
          set -e

          SETTINGS=$(find project -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::Không tìm thấy settings.gradle hoặc settings.gradle.kts"
            find project -type f | sort
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          echo "Android
